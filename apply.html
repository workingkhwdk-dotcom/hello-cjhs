<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>
  // PC/모바일 자동 감지 -> 모바일이면 통합 모바일 페이지로 이동.
  // ?force=desktop 이 붙어 있으면 리다이렉트하지 않는다(테스트/의도적 PC 보기용).
  (function(){
    if(new URLSearchParams(location.search).get('force') === 'desktop') return;
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || window.innerWidth <= 768;
    if(isMobile) location.replace('mobile.html?section=apply');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>입학 상담 신청 - 창원중앙고등학교</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4dd5ad47">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14284F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="창원중앙고 상담">
