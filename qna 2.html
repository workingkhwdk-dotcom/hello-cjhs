<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>
  // PC/모바일 자동 감지 -> 모바일이면 통합 모바일 페이지로 이동.
  // ?force=desktop 이 붙어 있으면 리다이렉트하지 않는다(테스트/의도적 PC 보기용).
  (function(){
    if(new URLSearchParams(location.search).get('force') === 'desktop') return;
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || window.innerWidth <= 768;
    if(isMobile) location.replace('mobile.html?section=qna');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>입학 상담 Q&A - 창원중앙고등학교</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14284F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="창원중앙고 상담">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="subpage-wrap qna-page-wrap">
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    홈화면
  </a>

  <section class="panel panel-accent accent-navy subpage-panel">
    <h1>입학 상담 Q&amp;A</h1>

    <!-- 목록(좌) + 새 질문 작성(우) 2단 구성 -->
    <div class="qna-columns" id="list-view">
      <div class="qna-list" id="qna-list">
        <div class="qna-empty">불러오는 중...</div>
      </div>

      <!-- 질문 작성 폼 (로그인 불필요) -->
      <div class="qna-write-box" id="write-box">
        <div class="field">
          <label for="q-author">작성자 이름 (선택)</label>
          <input type="text" id="q-author" placeholder="예: 학부모, 홍길동 (미입력 시 '학부모'로 표시)">
        </div>
        <div class="field">
          <label for="q-email">이메일 (선택 — 답변 등록 시 알림을 받아보세요)</label>
          <input type="email" id="q-email" placeholder="예: parent@example.com">
        </div>
        <div class="field">
          <label for="q-title">질문 제목 *</label>
          <input type="text" id="q-title" placeholder="예: 2학년 선택과목은 언제부터 정하나요?">
        </div>
        <div class="field">
          <label for="q-body">질문 내용 *</label>
          <textarea id="q-body" placeholder="궁금하신 내용을 자유롭게 적어주세요."></textarea>
        </div>
        <div class="field">
          <label>수정·삭제 시 본인 확인용 비밀번호 *</label>
          <div class="pw-row">
            <input type="password" id="q-pw" placeholder="비밀번호 (4자 이상)">
            <input type="password" id="q-pw2" placeholder="비밀번호 확인">
          </div>
          <div class="hint">이 비밀번호로 나중에 본인 글을 수정·삭제할 수 있어요. 잊지 않게 기억해 주세요.</div>
        </div>
        <label class="checkbox-chip private-row" style="border:none; padding:0;">
          <input type="checkbox" id="q-private" class="chk">
          <span>비밀글(본인만 확인)</span>
        </label>
        <button class="btn btn-point" id="q-submit-btn">질문 등록하기</button>
        <div class="form-msg" id="write-msg"></div>
      </div>
    </div>

    <!-- 상세 화면 -->
    <div id="detail-view" style="display:none;">
      <a href="#" class="back-link" id="back-to-list" style="margin-bottom:14px;">← 목록으로</a>
      <div class="qna-detail-box" id="detail-box"></div>
    </div>

  </section>
</div>

<footer class="site-footer">
  © 2026 창원중앙고등학교 · 본 페이지는 개발 중인 초안입니다.
</footer>

<!-- =========================================================
     Cloud Functions 연동
     아래 4개 URL을 배포된 실제 함수 URL로 교체하세요.
     예) https://asia-northeast3-YOUR_PROJECT_ID.cloudfunctions.net/qnaCreateQuestion
     ========================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAnGmSChA8ENvs4EM-biLnjG3PNH4JAzXY",
    authDomain: "hello-cjhs.firebaseapp.com",
    projectId: "hello-cjhs",
    storageBucket: "hello-cjhs.firebasestorage.app",
    messagingSenderId: "331353969542",
    appId: "1:331353969542:web:6d528577f2c7a9f0a49207",
    measurementId: "G-899YV6G5YB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // TODO: 배포 후 실제 함수 URL로 교체하세요.
  const FN_CREATE = "https://asia-northeast3-hello-cjhs.cloudfunctions.net/qnaCreateQuestion";
  const FN_VERIFY = "https://asia-northeast3-hello-cjhs.cloudfunctions.net/qnaVerifyPassword";
  const FN_EDIT   = "https://asia-northeast3-hello-cjhs.cloudfunctions.net/qnaEditQuestion";
  const FN_DELETE = "https://asia-northeast3-hello-cjhs.cloudfunctions.net/qnaDeleteQuestion";

  async function callFn(url, payload){
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok && !("ok" in data)) throw new Error(data.error || "요청에 실패했습니다.");
    return data;
  }

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
  }

  // ---------------------------------------------------------------
  // 질문 등록 (Cloud Function 호출 — 비밀번호는 서버에서만 해시됨)
  // ---------------------------------------------------------------
  const writeMsg = document.getElementById('write-msg');

  document.getElementById('q-submit-btn').addEventListener('click', async ()=>{
    const authorName = document.getElementById('q-author').value.trim();
    const email = document.getElementById('q-email').value.trim();
    const title = document.getElementById('q-title').value.trim();
    const body = document.getElementById('q-body').value.trim();
    const pw = document.getElementById('q-pw').value;
    const pw2 = document.getElementById('q-pw2').value;
    const isPrivate = document.getElementById('q-private').checked;
    writeMsg.className = 'form-msg';

    if(!title || !body){ writeMsg.textContent = '제목과 내용을 모두 입력해 주세요.'; writeMsg.classList.add('show','err'); return; }
    if(pw.length < 4){ writeMsg.textContent = '비밀번호는 4자 이상으로 입력해 주세요.'; writeMsg.classList.add('show','err'); return; }
    if(pw !== pw2){ writeMsg.textContent = '비밀번호와 비밀번호 확인이 서로 다릅니다.'; writeMsg.classList.add('show','err'); return; }

    try{
      await callFn(FN_CREATE, { authorName, email, title, body, password: pw, isPrivate });
      document.getElementById('q-author').value = '';
      document.getElementById('q-email').value = '';
      document.getElementById('q-title').value = '';
      document.getElementById('q-body').value = '';
      document.getElementById('q-pw').value = '';
      document.getElementById('q-pw2').value = '';
      document.getElementById('q-private').checked = false;
      writeMsg.textContent = '질문이 등록되었습니다.';
      writeMsg.classList.add('show','ok');
    }catch(err){
      console.error(err);
      writeMsg.textContent = err.message || '등록 중 오류가 발생했습니다. (Cloud Functions 배포/URL 설정을 확인해 주세요)';
      writeMsg.classList.add('show','err');
    }
  });

  // ---------------------------------------------------------------
  // 목록 실시간 구독 — qna_questions는 공개 컬렉션이라 여기서 직접 구독.
  // 비공개 글은 title/body가 처음부터 null로 저장되어 있어 서버 확인
  // 전에는 브라우저에 내용 자체가 내려오지 않는다.
  // ---------------------------------------------------------------
  const listEl = document.getElementById('qna-list');
  let allQuestions = [];
  const revealed = new Map(); // id -> { title, body } (비공개 글 중 비밀번호 확인에 성공한 것)

  function renderList(){
    const visible = allQuestions.filter(q => !q.deleted);
    if(visible.length === 0){
      listEl.innerHTML = '<div class="qna-empty">아직 등록된 질문이 없습니다. 첫 질문을 남겨보세요!</div>';
      return;
    }
    listEl.innerHTML = visible.map(q => `
      <div class="qna-item" data-id="${q.id}">
        <div class="qna-item-top">
          <div class="q-title">
            ${q.isPrivate
              ? `<span class="qna-private-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>비공개</span> 비공개 질문`
              : escapeHtml(q.title)}
          </div>
          <span class="qna-status ${(q.answer || q.answered) ? 'done' : 'wait'}">${(q.answer || q.answered) ? '답변완료' : '답변대기'}</span>
        </div>
        <div class="q-meta">${escapeHtml(q.authorName)} · ${fmtDate(q.createdAt)}</div>
      </div>
    `).join('');

    listEl.querySelectorAll('.qna-item').forEach(el=>{
      el.addEventListener('click', ()=>{ location.hash = el.dataset.id; });
    });
  }

  // 휴지통 글은 규칙상 읽을 수 없으므로 deleted==false 조건 필수. 정렬은 브라우저에서(복합 색인 불필요).
  const qy = query(collection(db, 'qna_questions'), where('deleted', '==', false));
  onSnapshot(qy, (snap)=>{
    allQuestions = snap.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b) => ((b.createdAt && b.createdAt.toMillis) ? b.createdAt.toMillis() : Date.now()) - ((a.createdAt && a.createdAt.toMillis) ? a.createdAt.toMillis() : Date.now()));
    renderList();
    renderDetailFromHash();
  }, (err)=>{
    console.error(err);
    listEl.innerHTML = '<div class="qna-empty">목록을 불러오지 못했습니다. (Firebase 설정/규칙을 확인해 주세요)</div>';
  });

  // ---------------------------------------------------------------
  // 목록 <-> 상세 화면 전환 (해시 기반)
  // ---------------------------------------------------------------
  const listView = document.getElementById('list-view');
  const detailView = document.getElementById('detail-view');
  const detailBox = document.getElementById('detail-box');

  function lockGateHtml(){
    return `
      <div class="qna-lock-gate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <p>비공개 질문입니다. 작성 시 등록한 비밀번호를 입력해 주세요. (서버에서 확인하기 전까지는 내용이 전달되지 않아요)</p>
        <div class="pw-check-row">
          <input type="password" id="unlock-pw" placeholder="비밀번호">
          <button class="btn btn-point" id="unlock-btn">확인</button>
        </div>
        <div class="form-msg" id="unlock-msg" style="max-width:280px; margin:10px auto 0;"></div>
      </div>
    `;
  }

  function detailContentHtml(qd, content){
    return `
      <div class="qna-item-top">
        <h3 class="q-title" style="margin:0;">${escapeHtml(content.title)}</h3>
        <span class="qna-status ${(qd.answer || qd.answered) ? 'done' : 'wait'}">${(qd.answer || qd.answered) ? '답변완료' : '답변대기'}</span>
      </div>
      <div class="q-meta">${escapeHtml(qd.authorName)} · ${fmtDate(qd.createdAt)}${qd.isPrivate ? ' · <span class="qna-private-badge">비공개</span>' : ''}</div>
      <div class="q-body">${escapeHtml(content.body)}</div>
      ${(content.answer || qd.answer) ? `
        <div class="qna-answer">
          <div class="a-label"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:5px;"><path d="M12 3 2 9l10 6 10-6-10-6Z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>학교 답변</div>
          <div class="a-body">${escapeHtml(content.answer || qd.answer)}</div>
        </div>` : ''}
      <div class="qna-detail-actions">
        <button class="btn btn-ghost" id="edit-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>수정</button>
        <button class="btn btn-ghost" id="delete-btn" style="color:var(--danger);"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>삭제</button>
      </div>
    `;
  }

  function editFormHtml(qd, content){
    return `
      <div class="field">
        <label for="edit-title">질문 제목 *</label>
        <input type="text" id="edit-title" value="${escapeHtml(content.title)}">
      </div>
      <div class="field">
        <label for="edit-body">질문 내용 *</label>
        <textarea id="edit-body">${escapeHtml(content.body)}</textarea>
      </div>
      <label class="checkbox-chip private-row" style="border:none; padding:0;">
        <input type="checkbox" id="edit-private" class="chk" ${qd.isPrivate ? 'checked' : ''}>
        <span>비밀글(본인만 확인)</span>
      </label>
      <div class="field">
        <label for="edit-pw">본인 확인 비밀번호 *</label>
        <input type="password" id="edit-pw" placeholder="비밀번호">
      </div>
      <div class="qna-detail-actions">
        <button class="btn btn-ghost" id="edit-cancel-btn">취소</button>
        <button class="btn btn-point" id="edit-save-btn">저장</button>
      </div>
      <div class="form-msg" id="edit-msg"></div>
    `;
  }

  function attachDetailActions(qd, content){
    document.getElementById('edit-btn').addEventListener('click', ()=>{
      detailBox.innerHTML = editFormHtml(qd, content);
      document.getElementById('edit-cancel-btn').addEventListener('click', ()=> renderDetailFromHash());
      document.getElementById('edit-save-btn').addEventListener('click', async ()=>{
        const newTitle = document.getElementById('edit-title').value.trim();
        const newBody = document.getElementById('edit-body').value.trim();
        const newPrivate = document.getElementById('edit-private').checked;
        const password = document.getElementById('edit-pw').value;
        const editMsg = document.getElementById('edit-msg');
        editMsg.className = 'form-msg';
        if(!newTitle || !newBody){ editMsg.textContent = '제목과 내용을 모두 입력해 주세요.'; editMsg.classList.add('show','err'); return; }
        if(!password){ editMsg.textContent = '비밀번호를 입력해 주세요.'; editMsg.classList.add('show','err'); return; }
        try{
          const result = await callFn(FN_EDIT, { id: qd.id, password, title: newTitle, body: newBody, isPrivate: newPrivate });
          if(result.ok === false){ editMsg.textContent = '비밀번호가 일치하지 않습니다.'; editMsg.classList.add('show','err'); return; }
          revealed.set(qd.id, { title: newTitle, body: newBody, answer: (revealed.get(qd.id) || {}).answer || qd.answer || null });
          renderDetailFromHash();
        }catch(err){
          console.error(err);
          editMsg.textContent = err.message || '저장에 실패했습니다.';
          editMsg.classList.add('show','err');
        }
      });
    });

    document.getElementById('delete-btn').addEventListener('click', async ()=>{
      const password = window.prompt('삭제하려면 등록 시 입력한 비밀번호를 입력해 주세요.');
      if(password === null) return;
      if(!confirm('이 질문을 삭제할까요? 삭제 후에는 게시판에서 보이지 않습니다.')) return;
      try{
        const result = await callFn(FN_DELETE, { id: qd.id, password });
        if(result.ok === false){ alert('비밀번호가 일치하지 않습니다.'); return; }
        location.hash = '';
      }catch(err){
        console.error(err);
        alert(err.message || '삭제에 실패했습니다.');
      }
    });
  }

  function renderDetailFromHash(){
    const id = location.hash.replace('#','');
    if(!id){
      listView.classList.remove('is-hidden');
      detailView.style.display = 'none';
      return;
    }
    const qd = allQuestions.find(q => q.id === id);
    if(!qd || qd.deleted){
      listView.classList.remove('is-hidden');
      detailView.style.display = 'none';
      return;
    }

    listView.classList.add('is-hidden');
    detailView.style.display = 'block';

    if(qd.isPrivate && !revealed.has(id)){
      detailBox.innerHTML = lockGateHtml();
      document.getElementById('unlock-btn').addEventListener('click', async ()=>{
        const pw = document.getElementById('unlock-pw').value;
        const unlockMsg = document.getElementById('unlock-msg');
        unlockMsg.className = 'form-msg';
        if(!pw){ unlockMsg.textContent = '비밀번호를 입력해 주세요.'; unlockMsg.classList.add('show','err'); return; }
        try{
          const result = await callFn(FN_VERIFY, { id, password: pw });
          if(!result.ok){ unlockMsg.textContent = '비밀번호가 일치하지 않습니다.'; unlockMsg.classList.add('show','err'); return; }
          revealed.set(id, { title: result.title, body: result.body, answer: result.answer || null });
          renderDetailFromHash();
        }catch(err){
          console.error(err);
          unlockMsg.textContent = err.message || '확인 중 오류가 발생했습니다. (Cloud Functions 배포/URL 설정을 확인해 주세요)';
          unlockMsg.classList.add('show','err');
        }
      });
      return;
    }

    const content = qd.isPrivate ? revealed.get(id) : { title: qd.title, body: qd.body };
    detailBox.innerHTML = detailContentHtml(qd, content);
    attachDetailActions(qd, content);
  }

  document.getElementById('back-to-list').addEventListener('click', (e)=>{
    e.preventDefault();
    location.hash = '';
  });
  window.addEventListener('hashchange', renderDetailFromHash);
</script>

</body>
</html>
