<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>관리자(모바일) - 창원중앙고등학교</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/admin-mobile-icon-192.png?v=7a4f3e13">
<link rel="apple-touch-icon" href="icons/admin-mobile-apple-touch-icon.png?v=dc7fcfd2">
<link rel="manifest" href="admin-mobile-manifest.json">
<meta name="theme-color" content="#FFC72C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="중앙고 관리자">

<link rel="stylesheet" href="css/style.css">
<style>
  @keyframes deep-flash{ 0%,60%{ box-shadow:0 0 0 3px #f5b400; background:#fff8dc; } 100%{ box-shadow:none; } }
  .deep-flash{ animation:deep-flash 2.4s ease-out; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); }
  /* 당겨서 새로고침을 직접 처리하므로 브라우저 기본 동작(크롬의 전체 새로고침)은 끈다 */
  body{ padding-bottom:calc(64px + env(safe-area-inset-bottom)); overscroll-behavior-y:contain; }
  .am-header{
    position:sticky; top:0; z-index:50; background:var(--accent); color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .am-header-title{ min-width:0; overflow:hidden; }
  .am-header h1{ font-size:15px; margin:0; font-family:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .am-header .who{ font-size:10.5px; opacity:.75; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .am-header-actions{ display:flex; gap:6px; flex-shrink:0; }
  .am-header-actions button{
    background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:10px;
    padding:7px 10px; font-size:11px; font-weight:700; font-family:var(--ui); cursor:pointer;
  }

  /* 당겨서 새로고침 표시 */
  .am-ptr{
    position:fixed; left:50%; top:0; z-index:60; transform:translate(-50%, -48px);
    background:#fff; color:var(--accent); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:800;
    box-shadow:0 6px 18px -6px rgba(15,23,42,.35); pointer-events:none; opacity:0; white-space:nowrap;
  }
  .am-ptr.spin::before{ content:""; display:inline-block; width:11px; height:11px; margin-right:6px; vertical-align:-1px;
    border:2px solid var(--accent); border-right-color:transparent; border-radius:50%; animation:am-spin .7s linear infinite; }
  @keyframes am-spin{ to{ transform:rotate(360deg); } }

  .am-main{ padding:14px; max-width:520px; margin:0 auto; }
  .am-section{ display:none; }
  .am-section.on{ display:block; }
  .am-filter-row{ display:flex; gap:6px; margin-bottom:12px; }
  .am-filter-row button{
    flex:1; border:1.5px solid var(--sep); background:#fff; border-radius:10px; padding:8px; font-size:12px;
    font-weight:700; color:var(--ink-2); font-family:var(--ui); cursor:pointer;
  }
  .am-filter-row button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .am-sort-select{
    width:100%; margin-bottom:12px; border:1.5px solid var(--sep); border-radius:10px; padding:8px 10px;
    font-size:12.5px; font-family:var(--ui); color:var(--ink-2); background:#fff;
  }
  .am-consult-card .am-c-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
  .am-consult-card .am-c-head .chev{ flex-shrink:0; width:16px; height:16px; color:var(--ink-3); transition:transform .15s ease; }
  .am-consult-card.expanded .am-c-head .chev{ transform:rotate(180deg); }
  .am-consult-card .am-c-body{ display:none; margin-top:10px; }
  .am-consult-card.expanded .am-c-body{ display:block; }

  .am-toolbar-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .am-toolbar-row .am-sort-select{ flex:1; margin-bottom:0; }
  .am-toolbar-row .count{ flex:1; font-size:12px; color:var(--ink-2); }
  .am-select-toggle-btn{
    flex-shrink:0; border:1.5px solid var(--sep); background:#fff; border-radius:10px; padding:8px 12px;
    font-size:12px; font-weight:700; color:var(--ink-2); font-family:var(--ui); cursor:pointer;
  }
  .am-select-toggle-btn.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .am-select-check{ display:none; flex-shrink:0; width:19px; height:19px; margin-right:2px; cursor:pointer; }
  .select-mode .am-select-check{ display:block; }
  .am-consult-card.selected, .qna-item-selectable.selected{ box-shadow:0 0 0 2px var(--accent-2); }

  .am-bulk-bar{
    display:none; position:fixed; left:12px; right:12px; z-index:90;
    bottom:calc(64px + env(safe-area-inset-bottom) + 10px);
    background:var(--accent); color:#fff; border-radius:14px; padding:10px 14px;
    align-items:center; justify-content:space-between; box-shadow:0 10px 24px -10px rgba(15,23,42,.5);
  }
  .am-bulk-bar.show{ display:flex; }
  .am-bulk-bar span{ font-size:12.5px; font-weight:700; }
  .am-bulk-bar button{ min-height:auto; padding:7px 14px; font-size:12px; }
  .am-stat-row{ display:flex; gap:8px; margin-bottom:14px; }
  .am-stat{ flex:1; background:#fff; border-radius:12px; padding:10px; text-align:center; box-shadow:var(--shadow-card); }
  .am-stat .n{ font-size:17px; font-weight:800; color:var(--accent); }
  .am-stat .l{ font-size:10px; color:var(--ink-2); margin-top:2px; }
  .am-tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:100; display:flex;
    background:#fff; border-top:1px solid var(--sep); padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -6px 18px -10px rgba(15,23,42,.25);
  }
  .am-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px;
    border:none; background:none; color:var(--ink-3); font-family:var(--ui); font-size:10.5px; font-weight:700; cursor:pointer;
  }
  .am-tab svg{ width:20px; height:20px; }
  .am-tab.on{ color:var(--accent-2); }
  .am-tab-icon-wrap{ position:relative; display:inline-flex; }
  .am-tab .badge{
    position:absolute; top:-5px; right:-9px; background:var(--danger); color:#fff;
    font-size:9px; font-weight:800; line-height:1; border-radius:8px; padding:2px 5px; min-width:14px;
    display:none; box-shadow:0 0 0 2px #fff;
  }
  .am-tab .badge.show{ display:block; }
  h3.am-trash-h{ font-size:13px; margin:18px 0 8px; color:var(--ink-2); }

  /* 로그인 화면 — 로그인 후에는 통째로 숨겨서 대시보드가 화면 맨 위부터 시작한다 */
  .am-login-wrap{ padding-top:calc(28px + env(safe-area-inset-top)); padding-bottom:40px; }
  .am-login-brand{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:18px; }
  .am-login-brand svg{ width:44px; height:33px; }
  .am-login-brand-text{ font-family:var(--title); font-size:14px; font-weight:700; color:var(--accent); letter-spacing:.02em; }
  .login-box{ margin:0 16px; }
</style>
</head>

  <section class="panel panel-accent accent-navy subpage-panel login-box" id="login-box">
    <h1 style="font-size:18px;">관리자 로그인</h1>
    <p class="lede">Firebase Authentication(이메일/비밀번호)에 등록된 계정으로 로그인해 주세요.</p>
    <form id="login-form">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-point btn-block">로그인</button>
      <div class="form-msg" id="login-msg"></div>
    </form>

<!-- 대시보드 -->
<div id="dashboard" style="display:none;">
  <div class="am-header">
    <div class="am-header-title">
      <h1>창원중앙고 관리자</h1>
      <div class="who" id="who-am-i"></div>
    </div>
    <div class="am-header-actions">
      <button id="logout-btn">로그아웃</button>
    </div>
  </div>

  <main class="am-main">

    <!-- 상담 신청 현황 -->
    <section class="am-section on" data-sec="consult">
      <div class="am-stat-row">
        <div class="am-stat"><div class="n" id="am-stat-total">-</div><div class="l">총 신청</div></div>
        <div class="am-stat"><div class="n" id="am-stat-new">-</div><div class="l">신규</div></div>
        <div class="am-stat"><div class="n" id="am-stat-done">-</div><div class="l">처리완료</div></div>
      </div>
      <div class="am-filter-row" id="am-consult-filter">
        <button class="on" data-filter="all">전체</button>
        <button data-filter="전화">전화</button>
        <button data-filter="방문">방문</button>
        <button data-filter="설명회">설명회</button>
      </div>
      <div class="am-toolbar-row">
        <input id="am-consult-search" class="am-sort-select" type="search" placeholder="이름·연락처·중학교·내용 검색">
        <button class="am-select-toggle-btn" id="am-consult-export">엑셀</button>
      </div>
      <div class="am-toolbar-row">
        <select id="am-consult-sort" class="am-sort-select">
          <option value="createdAt-desc">최신순</option>
          <option value="createdAt-asc">오래된순</option>
          <option value="status-asc">신규 먼저</option>
          <option value="status-desc">처리완료 먼저</option>
        </select>
        <button class="am-select-toggle-btn" id="am-consult-select-toggle">선택</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getMessaging, getToken, onMessage }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAnGmSChA8ENvs4EM-biLnjG3PNH4JAzXY",
    authDomain: "hello-cjhs.firebaseapp.com",
    projectId: "hello-cjhs",
    storageBucket: "hello-cjhs.firebasestorage.app",
    messagingSenderId: "331353969542",
    appId: "1:331353969542:web:6d528577f2c7a9f0a49207",
    measurementId: "G-899YV6G5YB"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const VAPID_KEY = "BLGjgZUnDXnhLmTHzZUqigtZQB0HEjF1-RNCfzmeeh0vjPraVS7ggFmawA9i9LFnhG6stR_4kwBylcD0Jq4BChY"; // Firebase Console > 프로젝트 설정 > Cloud Messaging > 웹 푸시 인증서

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(ts){
    if(!ts) return '-';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }
  let toastTimer = null;
  function showToast(text){
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 2400);
  }

  // ---------------- 로그인 ----------------
  const loginWrap = document.getElementById('login-wrap');
  const dashboard = document.getElementById('dashboard');
  const tabbar = document.getElementById('am-tabbar');

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const loginMsg = document.getElementById('login-msg');
    loginMsg.className = 'form-msg';
    try{
      await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
    }catch(err){
      loginMsg.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해 주세요.';
      loginMsg.classList.add('show','err');
    }
  });
  document.getElementById('logout-btn').addEventListener('click', ()=> signOut(auth));

  let autoTimer = null;
  onAuthStateChanged(auth, (user)=>{
    if(user){
      loginWrap.style.display = 'none';   // 학교 로고/이름 블록까지 통째로 숨김
      dashboard.style.display = 'block';
      tabbar.style.display = 'flex';
      document.getElementById('who-am-i').textContent = user.email || '';
      refreshAll();
      enablePushNotifications();
      clearInterval(autoTimer);
      autoTimer = setInterval(()=>{ if(!document.hidden) tryRefresh(false); }, AUTO_REFRESH_MS);
    }else{
      loginWrap.style.display = 'block';
      dashboard.style.display = 'none';
      tabbar.style.display = 'none';
      clearInterval(autoTimer);
    }
  });

  // ---------------- 탭 전환 ----------------
  document.querySelectorAll('.am-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.am-tab').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.am-section').forEach(s=>s.classList.remove('on'));
      btn.classList.add('on');
      document.querySelector(`.am-section[data-sec="${btn.dataset.sec}"]`).classList.add('on');
      window.scrollTo(0,0);
    });
  });

  // ---------------- 알림 등록 (항상 켜짐 — 로그인하면 자동 등록) ----------------
  async function enablePushNotifications(){
    try{
      if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
      if(Notification.permission === 'denied') return;
      const permission = await Notification.requestPermission();
      if(permission !== 'granted') return;
      const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const messaging = getMessaging(app);
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
      if(!token) return;
      await setDoc(doc(db, 'admin_fcm_tokens', token), { token, createdAt: serverTimestamp(), ua: navigator.userAgent });
      onMessage(messaging, (payload)=>{
        showToast((payload.data && payload.data.title) || '새 알림');
        tryRefresh(false); // 앱이 열려 있을 때 새 알림이 오면 목록도 바로 갱신
      });
    }catch(err){
      console.error(err);
    }
  }

  // ---------------- 새로고침: 자동(주기) + 당겨서 새로고침 ----------------
  const AUTO_REFRESH_MS = 60 * 1000;
  let refreshing = false;

  // 답변을 입력 중이거나 선택 모드로 작업 중이면 목록을 다시 그리지 않는다(입력이 날아가므로).
  function isUserBusy(){
    const ae = document.activeElement;
    if(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return true;
    if([...document.querySelectorAll('.answer-form textarea')].some(t => t.value !== t.defaultValue)) return true;
    return consultSelected.size > 0 || qnaSelected.size > 0;
  }
  async function tryRefresh(manual){
    if(refreshing) return;
    if(isUserBusy()){
      if(manual) showToast('입력·선택 중이라 새로고침을 건너뛰었어요.');
      return;
    }
    refreshing = true;
    try{ await refreshAll(); if(manual) showToast('새로고침했어요.'); }
    finally{ refreshing = false; }
  }
  // 앱으로 다시 돌아왔을 때 한 번 갱신
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && auth.currentUser) tryRefresh(false);
  });

  (function setupPullToRefresh(){
    const ptr = document.getElementById('am-ptr');
    const THRESHOLD = 70;
    let startY = null, dy = 0;
    function setPtr(offset, text, spin){
      ptr.textContent = text;
      ptr.classList.toggle('spin', !!spin);
      ptr.style.opacity = offset > 4 ? '1' : '0';
      ptr.style.transform = `translate(-50%, ${Math.min(offset, 90) - 48 + 12}px)`;
    }
    document.addEventListener('touchstart', (e)=>{
      startY = (window.scrollY <= 0 && auth.currentUser && e.touches.length === 1) ? e.touches[0].clientY : null;
      dy = 0;
    }, { passive:true });
    document.addEventListener('touchmove', (e)=>{
      if(startY === null) return;
      dy = e.touches[0].clientY - startY;
      if(dy > 0 && window.scrollY <= 0) setPtr(dy * 0.5, dy * 0.5 >= THRESHOLD * 0.5 ? '놓으면 새로고침' : '↓ 당겨서 새로고침', false);
      else setPtr(0, '', false);
    }, { passive:true });
    document.addEventListener('touchend', async ()=>{
      if(startY === null) return;
      const pulled = dy * 0.5 >= THRESHOLD * 0.5;
      startY = null; dy = 0;
      if(!pulled){ setPtr(0, '', false); return; }
      setPtr(56, '새로고침 중...', true);
      await tryRefresh(true);
      setPtr(0, '', false);
    });
  })();

  // ---------------- 데이터 로딩 ----------------
  let consultCache = [];
  let qnaCache = [];
  let consultFilter = 'all';
  let consultSort = 'createdAt-desc';
  const CONSULT_SORT_ACCESSORS = {
    createdAt: d => (d.createdAt && d.createdAt.seconds) || 0,
    status: d => (d.status === 'done' ? 1 : 0)
  };

  document.querySelectorAll('#am-consult-filter button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#am-consult-filter button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      consultFilter = btn.dataset.filter;
      renderConsultCards();
    });
  });
  document.getElementById('am-consult-sort').addEventListener('change', (e)=>{
    consultSort = e.target.value;
    renderConsultCards();
  });


  // ---------------- 검색 + 엑셀(CSV) 내보내기 ----------------
  let consultQuery = '';
  function matchConsultQuery(d){
    if(!consultQuery) return true;
    const hay = [d.guardianName, d.phone, d.middleSchool, d.detail, (d.topics || []).join(' '), d.topicOther, d.consultType].join(' ').toLowerCase();
    return hay.includes(consultQuery.toLowerCase());
  }
  function csvCell(v){
    let t = String(v == null ? '' : v).replace(/\r?\n/g, ' ');
    if(/^[=+\-@]/.test(t)) t = "'" + t; // 엑셀 수식 실행 방지
    return '"' + t.replace(/"/g, '""') + '"';
  }
  function exportConsultCsv(list){
    if(!list.length){ showToast('내보낼 신청이 없어요.'); return; }
    const head = ['접수일시','중학교','보호자','관심분야','상담유형','연락처','희망일시','문의내용','상태'];
    const rows = list.map(d => [
      fmtDate(d.createdAt), d.middleSchool, d.guardianName,
      (d.topics || []).map(t => t === '기타' && d.topicOther ? `기타(${d.topicOther})` : t).join(', '),
      d.consultType, d.phone, (d.visitDates || []).join(', '), d.detail, d.status === 'done' ? '처리완료' : '신규'
    ]);
    const csv = '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = `상담신청_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
  }
  document.getElementById('am-consult-search').addEventListener('input', (e)=>{
    consultQuery = e.target.value.trim();
    renderConsultCards();
  });
  document.getElementById('am-consult-export').addEventListener('click', ()=>{
    exportConsultCsv((consultCache || []).filter(d => !d.deleted && (consultFilter === 'all' || d.consultType === consultFilter) && matchConsultQuery(d)));
  });

  // ---------------- 다중 선택(선택모드 + 일괄 삭제) — 상담신청/Q&A 공용 패턴 ----------------
  let consultSelectMode = false;
  let consultSelected = new Set();
  let qnaSelectMode = false;
  let qnaSelected = new Set();

  function makeSelectToggle(toggleBtnId, getMode, setMode, selectedSet, render){
    document.getElementById(toggleBtnId).addEventListener('click', ()=>{
      const next = !getMode();
      setMode(next);
      selectedSet.clear();
      document.getElementById(toggleBtnId).classList.toggle('on', next);
      document.getElementById(toggleBtnId).textContent = next ? '선택 취소' : '선택';
      render();
    });
  }
  makeSelectToggle('am-consult-select-toggle', ()=>consultSelectMode, (v)=>{consultSelectMode=v;}, consultSelected, renderConsultCards);
  makeSelectToggle('am-qna-select-toggle', ()=>qnaSelectMode, (v)=>{qnaSelectMode=v;}, qnaSelected, renderQnaCards);

  function toggleConsultSelect(id, cardEl){
    if(consultSelected.has(id)){ consultSelected.delete(id); cardEl.classList.remove('selected'); }
    else{ consultSelected.add(id); cardEl.classList.add('selected'); }
    cardEl.querySelector('.am-select-check').checked = consultSelected.has(id);
    updateBulkBar('am-consult-bulk-bar', 'am-consult-bulk-count', consultSelected.size);
  }
  function toggleQnaSelect(id, cardEl){
    if(qnaSelected.has(id)){ qnaSelected.delete(id); cardEl.classList.remove('selected'); }
    else{ qnaSelected.add(id); cardEl.classList.add('selected'); }
    cardEl.querySelector('.am-select-check').checked = qnaSelected.has(id);
    updateBulkBar('am-qna-bulk-bar', 'am-qna-bulk-count', qnaSelected.size);
  }
  function updateBulkBar(barId, countId, count){
    document.getElementById(barId).classList.toggle('show', count > 0);
    document.getElementById(countId).textContent = `${count}개 선택됨`;
  }

  document.getElementById('am-consult-bulk-delete').addEventListener('click', async ()=>{
    const ids = [...consultSelected];
    if(ids.length === 0) return;
    if(!confirm(`선택한 ${ids.length}건을 휴지통으로 이동할까요?`)) return;
    try{
      await Promise.all(ids.map(id => updateDoc(doc(db, 'consultations', id), { deleted: true, deletedAt: serverTimestamp() })));
      consultSelected.clear();
      updateBulkBar('am-consult-bulk-bar', 'am-consult-bulk-count', 0);
      await loadConsultCache();
      renderConsultCards();
      renderTrashCards();
      showToast(`${ids.length}건을 휴지통으로 옮겼어요.`);
    }catch(err){ console.error(err); alert('일괄 삭제에 실패했습니다.'); }
  });
  document.getElementById('am-qna-bulk-delete').addEventListener('click', async ()=>{
    const ids = [...qnaSelected];
    if(ids.length === 0) return;
    if(!confirm(`선택한 질문 ${ids.length}건을 휴지통으로 이동할까요?`)) return;
    try{
      await Promise.all(ids.map(id => updateDoc(doc(db, 'qna_questions', id), { deleted: true, deletedAt: serverTimestamp() })));
      qnaSelected.clear();
      updateBulkBar('am-qna-bulk-bar', 'am-qna-bulk-count', 0);
      await loadQnaCache();
      renderQnaCards();
      renderTrashCards();
      showToast(`${ids.length}건을 휴지통으로 옮겼어요.`);
    }catch(err){ console.error(err); alert('일괄 삭제에 실패했습니다.'); }
  });

  function updateTabBadges(){
    const consultBadge = document.getElementById('am-badge-consult');
    const qnaBadge = document.getElementById('am-badge-qna');
    const newConsults = (consultCache || []).filter(d => !d.deleted && d.status !== 'done').length;
    const waitingQna = (qnaCache || []).filter(d => !d.deleted && !d.answer).length;
    consultBadge.textContent = newConsults > 9 ? '9+' : String(newConsults);
    consultBadge.classList.toggle('show', newConsults > 0);
    qnaBadge.textContent = waitingQna > 9 ? '9+' : String(waitingQna);
    qnaBadge.classList.toggle('show', waitingQna > 0);
  }

  async function refreshAll(){
    await Promise.all([loadConsultCache(), loadQnaCache()]);
    renderConsultCards();
    renderQnaCards();
    renderTrashCards();
    applyPendingOpen();
  }

  // 푸시 알림을 눌러 들어온 경우: 해당 신청/질문으로 바로 이동
  //   ?open=consult|qna&id=문서ID  (앱이 이미 열려 있으면 서비스워커가 메시지로 알려줌)

  let pendingOpen = null;
  (function(){
    const p = new URLSearchParams(location.search);
    if(p.get('open') && p.get('id')){
      pendingOpen = { kind: p.get('open'), id: p.get('id') };
      history.replaceState(null, '', location.pathname);
    }
  })();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', (e)=>{
      const m = e.data || {};
      if(m.type === 'open-link' && m.link && auth.currentUser){
        const p = new URL(m.link, location.origin).searchParams;
        pendingOpen = { kind: p.get('open'), id: p.get('id') };
        refreshAll();
      }
    });
  }
  function applyPendingOpen(){
    if(!pendingOpen || !auth.currentUser || (consultCache === null && qnaCache === null)) return;
    const { kind, id } = pendingOpen;
    pendingOpen = null;
    const isQna = kind === 'qna';
    document.querySelector(`.am-tab[data-sec="${isQna ? 'qna' : 'consult'}"]`).click();
    const el = document.querySelector(isQna ? `.qna-item-selectable[data-id="${id}"]` : `.am-consult-card[data-id="${id}"]`);
    if(!el){ showToast('이미 삭제됐거나 목록에 없는 항목이에요.'); return; }
    if(!isQna) el.classList.add('expanded');
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    el.classList.remove('deep-flash'); void el.offsetWidth; el.classList.add('deep-flash');
  }

  async function loadConsultCache(){
    try{
      const q = query(collection(db, 'consultations'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      // pinHash(취소용 비밀번호 해시)는 화면에서 쓰지 않으므로 캐시에 담지 않는다
      consultCache = snap.docs.map(d => { const { pinHash, ...rest } = d.data(); return { id:d.id, ...rest }; });
    }catch(err){ console.error(err); consultCache = null; }
  }
  // 비공개 글의 답변은 qna_secrets에만 저장(공개 컬렉션에는 answered:true만 표시)
  async function saveQnaAnswer(id, answer){
    const q = (qnaCache || []).find(d => d.id === id);
    if(q && q.isPrivate){
      await updateDoc(doc(db, 'qna_secrets', id), { answer });
      await updateDoc(doc(db, 'qna_questions', id), { answer: null, answered: true, answeredAt: serverTimestamp() });
    }else{
      await updateDoc(doc(db, 'qna_questions', id), { answer, answered: true, answeredAt: serverTimestamp() });
    }
  }

  async function loadQnaCache(){
    try{
      const q = query(collection(db, 'qna_questions'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      const list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      // 1회성 정리: 예전 방식으로 공개 컬렉션에 남아 있는 비공개 글 답변은 qna_secrets로 옮기고,
      // deleted 필드가 없는 글(예전에 복구한 글)은 deleted:false를 채운다(공개 목록 조회 조건).
      await Promise.all(list.map(async (q)=>{
        try{
          if(q.isPrivate && q.answer){
            await updateDoc(doc(db, 'qna_secrets', q.id), { answer: q.answer });
            await updateDoc(doc(db, 'qna_questions', q.id), { answer: null, answered: true });
          }
          if(q.deleted === undefined){
            await updateDoc(doc(db, 'qna_questions', q.id), { deleted: false });
            q.deleted = false;
          }
        }catch(err){ console.error('Q&A 정리 실패', q.id, err); }
      }));
      await Promise.all(list.filter(q => q.isPrivate).map(async (q)=>{
        try{
          const secretSnap = await getDoc(doc(db, 'qna_secrets', q.id));
          if(secretSnap.exists()){ q.title = secretSnap.data().title; q.body = secretSnap.data().body; q.answer = secretSnap.data().answer || q.answer || null; }
        }catch(err){ console.error('비공개 질문 원문 로드 실패', q.id, err); }
      }));
      qnaCache = list;
    }catch(err){ console.error(err); qnaCache = null; }
  }

  // ---------------- 상담 신청 (카드형) ----------------
  function renderConsultCards(){
    updateTabBadges();
    const listEl = document.getElementById('am-consult-list');
    if(consultCache === null){
      listEl.innerHTML = '<div class="qna-empty">불러오지 못했습니다. (admins 등록 여부 확인)</div>';
      return;
    }
    const all = consultCache.filter(d => !d.deleted);
    document.getElementById('am-stat-total').textContent = all.length;
    document.getElementById('am-stat-new').textContent = all.filter(d=>d.status!=='done').length;
    document.getElementById('am-stat-done').textContent = all.filter(d=>d.status==='done').length;

    const active = all.filter(d => (consultFilter === 'all' || d.consultType === consultFilter) && matchConsultQuery(d));
    if(active.length === 0){
      listEl.innerHTML = '<div class="qna-empty">접수된 상담 신청이 없습니다.</div>';
      return;
    }

    const [sortKey, sortDir] = consultSort.split('-');
    const accessor = CONSULT_SORT_ACCESSORS[sortKey] || CONSULT_SORT_ACCESSORS.createdAt;
    active.sort((a,b)=>{
      const av = accessor(a), bv = accessor(b);
      const cmp = av > bv ? 1 : av < bv ? -1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });

    // 자동 새로고침으로 다시 그려도 펼쳐 둔 카드는 그대로 유지
    const expandedIds = new Set([...listEl.querySelectorAll('.am-consult-card.expanded')].map(c => c.dataset.id));

    listEl.classList.toggle('select-mode', consultSelectMode);
    listEl.innerHTML = active.map(d=>{
      const topics = [...(d.topics || [])];
      const topicsText = topics.length ? topics.map(t => t === '기타' && d.topicOther ? `기타(${d.topicOther})` : t).join(', ') : '-';
      const visitText = (d.visitDates || []).join(', ');
      const isSel = consultSelected.has(d.id);
      return `
        <div class="qna-detail-box am-consult-card ${isSel ? 'selected' : ''} ${expandedIds.has(d.id) ? 'expanded' : ''}" data-id="${d.id}">
          <div class="am-c-head">
            <input type="checkbox" class="am-select-check" ${isSel ? 'checked' : ''}>
            <div style="min-width:0; flex:1;">
              <h3 class="q-title" style="margin:0; font-size:14px;">${escapeHtml(d.guardianName) || '보호자 미상'} · ${escapeHtml(d.consultType) || '-'}</h3>
              <div class="q-meta">${fmtDate(d.createdAt)} · ${escapeHtml(d.middleSchool) || '-'}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
              <button class="status-pill ${d.status === 'done' ? 'done' : 'new'}" data-id="${d.id}" data-status="${d.status || 'new'}">${d.status === 'done' ? '처리완료' : '신규'}</button>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div class="am-c-body">
            <div class="q-body" style="font-size:12.5px;">
              관심분야: ${escapeHtml(topicsText)}<br>
              연락처: ${escapeHtml(d.phone) || '-'}<br>
              ${visitText ? `${d.consultType === '설명회' ? '설명회 일시' : '희망일시'}: ${escapeHtml(visitText)}<br>` : ''}
              ${d.consultType === '설명회' ? '응답' : '문의내용'}: ${(escapeHtml(d.detail) || '-').replace(/\n/g, '<br>')}
            </div>
            <div style="margin-top:10px; text-align:right;">
              <button class="btn btn-ghost btn-table consult-delete-btn" data-id="${d.id}" data-name="${escapeHtml(d.guardianName) || ''}">삭제</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.am-c-head').forEach(head=>{
      head.addEventListener('click', (e)=>{
        if(e.target.closest('.status-pill')) return; // 상태 토글 버튼은 별개로 동작
        const card = head.closest('.am-consult-card');
        if(consultSelectMode){
          toggleConsultSelect(card.dataset.id, card);
          return;
        }
        card.classList.toggle('expanded');
      });
    });
    listEl.querySelectorAll('.am-select-check').forEach(chk=>{
      chk.addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleConsultSelect(chk.closest('.am-consult-card').dataset.id, chk.closest('.am-consult-card'));
      });
    });

    listEl.querySelectorAll('.status-pill').forEach(pill=>{
      pill.addEventListener('click', async ()=>{
        const next = pill.dataset.status === 'done' ? 'new' : 'done';
        try{
          await updateDoc(doc(db, 'consultations', pill.dataset.id), { status: next });
          await loadConsultCache();
          renderConsultCards();
        }catch(err){ console.error(err); }
      });
    });
    listEl.querySelectorAll('.consult-delete-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = confirm(`${btn.dataset.name || '이'} 상담 신청 내역을 휴지통으로 이동할까요?`);
        if(!ok) return;
        btn.disabled = true;
        try{
          await updateDoc(doc(db, 'consultations', btn.dataset.id), { deleted: true, deletedAt: serverTimestamp() });
          await loadConsultCache();
          renderConsultCards();
          renderTrashCards();
        }catch(err){ console.error(err); alert('삭제에 실패했습니다.'); btn.disabled = false; }
      });
    });
  }

  // ---------------- Q&A 관리 (카드형) ----------------
  function renderQnaCards(){
    updateTabBadges();
    const listEl = document.getElementById('am-qna-list');
    if(qnaCache === null){
      listEl.innerHTML = '<div class="qna-empty">불러오지 못했습니다. (admins 등록 여부 확인)</div>';
      return;
    }
    const active = qnaCache.filter(d => !d.deleted);
    document.getElementById('am-qna-count').textContent = `총 ${active.length}건 (답변대기 ${active.filter(d=>!d.answer).length}건)`;
    if(active.length === 0){
      listEl.innerHTML = '<div class="qna-empty">등록된 질문이 없습니다.</div>';
      return;
    }
    listEl.classList.toggle('select-mode', qnaSelectMode);
    listEl.innerHTML = active.map(d => `
      <div class="qna-detail-box qna-item-selectable ${qnaSelected.has(d.id) ? 'selected' : ''}" data-id="${d.id}">
        <div class="qna-item-top">
          <input type="checkbox" class="am-select-check" ${qnaSelected.has(d.id) ? 'checked' : ''} style="margin-right:8px;">
          <h3 class="q-title" style="margin:0; font-size:14px; flex:1;">${d.isPrivate ? '<span class="qna-private-badge">비공개</span> ' : ''}${escapeHtml(d.title)}</h3>
          <span class="qna-status ${d.answer ? 'done' : 'wait'}">${d.answer ? '답변완료' : '답변대기'}</span>
        </div>
        <div class="q-meta">${escapeHtml(d.authorName)} · ${fmtDate(d.createdAt)}</div>
        <div class="q-body" style="font-size:12.5px;">${escapeHtml(d.body)}</div>
        <div class="answer-form">
          <textarea placeholder="답변을 입력해 주세요.">${escapeHtml(d.answer || '')}</textarea>
          <button class="btn btn-point qna-answer-btn" data-id="${d.id}">${d.answer ? '답변 수정' : '답변 등록'}</button>
        </div>
        <div style="margin-top:8px; text-align:right;">
          <button class="btn btn-ghost qna-delete-btn" data-id="${d.id}" data-title="${escapeHtml(d.title)}" style="padding:6px 10px; font-size:12px; color:var(--danger);">삭제</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('.am-select-check').forEach(chk=>{
      chk.addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleQnaSelect(chk.closest('.qna-item-selectable').dataset.id, chk.closest('.qna-item-selectable'));
      });
    });

    listEl.querySelectorAll('.qna-answer-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const textarea = btn.closest('.answer-form').querySelector('textarea');
        const answer = textarea.value.trim();
        if(!answer){ alert('답변 내용을 입력해 주세요.'); return; }
        btn.disabled = true;
        try{
          await saveQnaAnswer(btn.dataset.id, answer);
          await loadQnaCache();
          renderQnaCards();
          showToast('답변이 저장됐어요.');
        }catch(err){ console.error(err); alert('답변 저장에 실패했습니다.'); btn.disabled = false; }
      });
    });
    listEl.querySelectorAll('.qna-delete-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = confirm(`"${btn.dataset.title}" 질문을 휴지통으로 이동할까요?`);
        if(!ok) return;
        btn.disabled = true;
        try{
          await updateDoc(doc(db, 'qna_questions', btn.dataset.id), { deleted: true, deletedAt: serverTimestamp() });
          await loadQnaCache();
          renderQnaCards();
          renderTrashCards();
        }catch(err){ console.error(err); alert('삭제에 실패했습니다.'); btn.disabled = false; }
      });
    });
  }

  // ---------------- 휴지통 (카드형) ----------------
  function renderTrashCards(){
    const consultTrashEl = document.getElementById('am-trash-consult');
    const qnaTrashEl = document.getElementById('am-trash-qna');

    if(consultCache === null){
      consultTrashEl.innerHTML = '<div class="qna-empty">불러오지 못했습니다.</div>';
    }else{
      const trashed = consultCache.filter(d => d.deleted);
      consultTrashEl.innerHTML = trashed.length === 0
        ? '<div class="qna-empty">휴지통이 비어있습니다.</div>'
        : trashed.map(d => `
            <div class="qna-detail-box">
              <div class="qna-item-top">
                <h3 class="q-title" style="margin:0; font-size:14px;">${escapeHtml(d.guardianName) || '보호자 미상'} · ${escapeHtml(d.consultType) || '-'}</h3>
                <span class="qna-status wait">삭제됨</span>
              </div>
              <div class="q-meta">삭제일: ${fmtDate(d.deletedAt)}</div>
              <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn btn-ghost consult-restore-btn" data-id="${d.id}">복구</button>
                <button class="btn btn-ghost consult-purge-btn" data-id="${d.id}" data-name="${escapeHtml(d.guardianName) || ''}" style="color:var(--danger);">완전 삭제</button>
              </div>
            </div>
          `).join('');
      consultTrashEl.querySelectorAll('.consult-restore-btn').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          btn.disabled = true;
          try{
            await updateDoc(doc(db, 'consultations', btn.dataset.id), { deleted: deleteField(), deletedAt: deleteField() });
            await loadConsultCache(); renderConsultCards(); renderTrashCards();
          }catch(err){ console.error(err); alert('복구에 실패했습니다.'); btn.disabled = false; }
        });
      });
      consultTrashEl.querySelectorAll('.consult-purge-btn').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const ok = confirm(`${btn.dataset.name || '이'} 내역을 완전히 삭제할까요? 되돌릴 수 없습니다.`);
          if(!ok) return;
          btn.disabled = true;
          try{
            await deleteDoc(doc(db, 'consultations', btn.dataset.id));
            await loadConsultCache(); renderTrashCards();
          }catch(err){ console.error(err); alert('삭제에 실패했습니다.'); btn.disabled = false; }
        });
      });
    }

    if(qnaCache === null){
      qnaTrashEl.innerHTML = '<div class="qna-empty">불러오지 못했습니다.</div>';
    }else{
      const trashed = qnaCache.filter(d => d.deleted);
      qnaTrashEl.innerHTML = trashed.length === 0
        ? '<div class="qna-empty">휴지통이 비어있습니다.</div>'
        : trashed.map(d => `
            <div class="qna-detail-box">
              <div class="qna-item-top">
                <h3 class="q-title" style="margin:0; font-size:14px;">${escapeHtml(d.title)}</h3>
                <span class="qna-status wait">삭제됨</span>
              </div>
              <div class="q-meta">${escapeHtml(d.authorName)} · 삭제일: ${fmtDate(d.deletedAt)}</div>
              <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn btn-ghost qna-restore-btn" data-id="${d.id}">복구</button>
                <button class="btn btn-ghost qna-purge-btn" data-id="${d.id}" data-title="${escapeHtml(d.title)}" style="color:var(--danger);">완전 삭제</button>
              </div>
            </div>
          `).join('');
      qnaTrashEl.querySelectorAll('.qna-restore-btn').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          btn.disabled = true;
          try{
            await updateDoc(doc(db, 'qna_questions', btn.dataset.id), { deleted: false, deletedAt: deleteField() });
            await loadQnaCache(); renderQnaCards(); renderTrashCards();
          }catch(err){ console.error(err); alert('복구에 실패했습니다.'); btn.disabled = false; }
        });
      });
      qnaTrashEl.querySelectorAll('.qna-purge-btn').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const ok = confirm(`"${btn.dataset.title}" 질문을 완전히 삭제할까요? 되돌릴 수 없습니다.`);
          if(!ok) return;
          btn.disabled = true;
          try{
            await deleteDoc(doc(db, 'qna_questions', btn.dataset.id));
            await deleteDoc(doc(db, 'qna_secrets', btn.dataset.id)).catch(()=>{});
            await loadQnaCache(); renderTrashCards();
          }catch(err){ console.error(err); alert('삭제에 실패했습니다.'); btn.disabled = false; }
        });
      });
    }
  }
</script>

<script src="js/update-check.js" defer></script>
