<script>
  // PC/모바일 자동 감지 -> 모바일이면 통합 모바일 페이지로 이동.
  // ?force=desktop 이 붙어 있으면 리다이렉트하지 않는다(테스트/의도적 PC 보기용).
  (function(){
    if(new URLSearchParams(location.search).get('force') === 'desktop') return;
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || window.innerWidth <= 768;
    if(isMobile) location.replace('mobile.html');
  })();
</script>
