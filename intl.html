<!-- 다문화 가정 학부모용 안내 페이지(영어·일본어·중국어 간체).
     한국어 사이트의 핵심 내용(입학 배정, 고교학점제, 학교생활, 상담 신청 방법)을 요약 번역한 정적 페이지다.
     문구는 아래 <script>의 T 객체에 언어별로 있고, 학교 사실은 functions/index.js의 CORE_CONFIRMED_FACTS(확인된 사실)만 옮겼다.
     방문 설명회 날짜만 Firestore(site_content/applyOptions, 공개 읽기)에서 읽어 지금 날짜로 보여 준다(실패하면 기본값).
     PC/모바일 자동 이동은 하지 않는다(이 페이지 하나가 두 화면을 모두 지원). -->
<style>
:root{
  --bg:#F2F6FB; --surface:#FFFFFF;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8;
  --sep:rgba(15,23,42,0.10); --fill:rgba(15,23,42,0.05);
  --accent:#14284F; --accent-2:#2F56A3; --accent-tint:rgba(20,40,79,0.08);
  --point:#FFC72C; --point-tint:rgba(255,199,44,0.22); --point-ink:#7A5600;
  --grad:linear-gradient(135deg,#14284F 0%,#1F3E7A 45%,#2F56A3 100%);
  --shadow:0 1px 2px rgba(15,23,42,0.04), 0 14px 32px -18px rgba(20,40,79,0.35);
  --radius:18px;
  --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); -webkit-text-size-adjust:100%; }
body{ line-height:1.65; font-size:15.5px; overflow-x:clip; }
a{ color:var(--accent-2); }
.wrap{ max-width:880px; margin:0 auto; padding:0 16px; }

/* 상단 */
.hero{ background:var(--grad); color:#fff; position:relative; overflow:hidden; padding:calc(14px + env(safe-area-inset-top)) 0 26px; }
.hero::before{ content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px); background-size:16px 16px; }
.hero .wrap{ position:relative; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.back-ko{ display:inline-flex; align-items:center; gap:6px; color:#fff; text-decoration:none; font-size:13px; font-weight:700; opacity:.9; padding:6px 0; }
.back-ko:hover{ opacity:1; text-decoration:underline; }
.back-ko svg{ width:16px; height:16px; }
.langs{ display:flex; gap:4px; padding:4px; background:rgba(255,255,255,.14); border-radius:999px; }
.langs button{ border:0; background:transparent; color:#fff; font:inherit; font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap; }
.langs button[aria-pressed="true"]{ background:#fff; color:var(--accent); }
.langs button:focus-visible{ outline:2px solid var(--point); outline-offset:2px; }
.eyebrow{ font-size:12.5px; font-weight:800; letter-spacing:.04em; color:var(--point); margin:0 0 6px; text-transform:uppercase; }
.hero h1{ margin:0 0 10px; font-size:clamp(23px,5.4vw,32px); line-height:1.25; font-weight:800; letter-spacing:-.01em; }
.hero .lede{ margin:0; font-size:15px; color:rgba(255,255,255,.88); max-width:640px; }

/* 목차 */
.toc{ position:sticky; top:0; z-index:20; background:rgba(242,246,251,.94); backdrop-filter:saturate(1.4) blur(8px); -webkit-backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--sep); }
.toc .wrap{ display:flex; gap:6px; overflow-x:auto; padding:10px 16px; scrollbar-width:none; }
.toc .wrap::-webkit-scrollbar{ display:none; }
.toc a{ flex:none; text-decoration:none; color:var(--ink-2); font-size:13px; font-weight:700; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--sep); white-space:nowrap; }
.toc a:hover{ color:var(--accent); border-color:var(--accent); }

main{ padding:18px 0 36px; }
.callout{ display:flex; gap:12px; align-items:flex-start; background:var(--point-tint); border:1px solid rgba(255,199,44,.55); border-radius:14px; padding:13px 15px; margin:0 0 18px; font-size:14.5px; }
.callout svg{ flex:none; width:22px; height:22px; color:var(--point-ink); margin-top:1px; }
.callout b{ color:var(--point-ink); }

section.card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 22px 20px; margin:0 0 16px; scroll-margin-top:64px; }
section.card h2{ display:flex; align-items:center; gap:10px; margin:0 0 12px; font-size:19px; line-height:1.35; color:var(--accent); }
section.card h2 .num{ flex:none; display:inline-grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--accent); color:#fff; font-size:14px; }
section.card h3{ margin:18px 0 8px; font-size:15.5px; color:var(--ink); }
section.card p{ margin:0 0 10px; }
ul.facts{ margin:0; padding:0; list-style:none; }
ul.facts li{ position:relative; padding:0 0 0 18px; margin:0 0 8px; }
ul.facts li::before{ content:""; position:absolute; left:3px; top:.62em; width:7px; height:7px; border-radius:50%; background:var(--accent-2); }
.ko{ font-size:.92em; color:var(--ink-2); background:var(--fill); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.muted{ color:var(--ink-2); font-size:13.5px; }

/* 표 */
.tbl-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:4px 0 6px; }
table{ width:100%; border-collapse:collapse; font-size:14.5px; }
th,td{ text-align:left; vertical-align:top; padding:10px 10px; border-bottom:1px solid var(--sep); }
th{ font-size:12.5px; color:var(--ink-2); font-weight:800; background:var(--fill); }
td:first-child{ font-weight:700; width:34%; }
@media (max-width:560px){
  table.stack thead{ display:none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td{ display:block; width:100%; }
  table.stack tr{ border-bottom:1px solid var(--sep); padding:9px 0; }
  table.stack td{ border:0; padding:2px 0; }
}

/* 상담 방법 카드 */
.ways{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:6px 0 4px; }
@media (max-width:720px){ .ways{ grid-template-columns:1fr; } }
.way{ border:1.5px solid var(--sep); border-radius:14px; padding:15px 15px 14px; display:flex; flex-direction:column; gap:6px; }
.way .tag{ align-self:flex-start; font-size:12px; font-weight:800; color:var(--accent); background:var(--accent-tint); padding:3px 9px; border-radius:999px; }
.way h3{ margin:2px 0 0; }
.way p{ margin:0; font-size:14.5px; }
.way .actions{ margin-top:auto; padding-top:8px; display:flex; flex-wrap:wrap; gap:8px; }
.btn{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:800; font-size:14px; border-radius:999px; padding:9px 15px; border:1.5px solid var(--accent); color:var(--accent); background:#fff; }
.btn:hover{ background:var(--accent-tint); }
.btn.primary{ background:var(--accent); color:#fff; }
.btn.primary:hover{ background:var(--accent-2); border-color:var(--accent-2); }
.btn svg{ width:16px; height:16px; }
.dates{ margin:4px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
.dates li{ font-size:14px; font-weight:700; background:var(--fill); border-radius:9px; padding:6px 10px; }
.examples{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
.examples span{ font-size:13px; background:var(--accent-tint); color:var(--accent); border-radius:999px; padding:4px 10px; }

.phone{ font-weight:800; white-space:nowrap; }
footer{ padding:8px 0 calc(28px + env(safe-area-inset-bottom)); }
footer p{ margin:0 0 6px; font-size:13px; color:var(--ink-2); }
</style>
</head>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="back-ko" href="index.html" lang="ko"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>한국어 사이트</a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="ja" lang="ja">日本語</button>
        <button type="button" data-lang="zh" lang="zh-CN">中文</button>
      </div>
    </div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>

</header>
<nav class="toc" id="toc" aria-label="Contents"><div class="wrap" id="toc-links"></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap" id="footer"></footer>

  function parseKoDate(s) {
    var m = /(\d{1,2})\s*월\s*(\d{1,2})\s*일[^\d]*(?:(\d{1,2}):(\d{2}))?/.exec(s);
    if (!m) return null;
    var now = new Date(), y = now.getFullYear();
    var hh = m[3] ? +m[3] : 0, mm = m[4] ? +m[4] : 0;
    // 한국 시각(UTC+9) 기준으로 만든다. 연도가 적혀 있지 않으니, 반년 넘게 지난 날짜면 내년으로 본다.
    var mk = function (yr) { return new Date(Date.UTC(yr, +m[1] - 1, +m[2], hh - 9, mm)); };

    if (now - d > 183 * 864e5) d = mk(y + 1);
    return { date: d, hasTime: !!m[3] };

      if (p.date.getTime() < Date.now()) return;
      var opt = { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'short' };
      if (p.hasTime) { opt.hour = '2-digit'; opt.minute = '2-digit'; opt.hour12 = false; }
      var text;
      try { text = new Intl.DateTimeFormat(locale, opt).format(p.date); } catch (e) { text = String(s); }
      out.push({ ko: false, text: text });
    });
    return out;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---- 그리기 --------------------------------------------------------------------
  var current = 'en';
  function list(items) { return '<ul class="facts">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'; }
  function table(head, rows) {
    return '<div class="tbl-scroll"><table class="stack"><thead><tr><th>' + head[0] + '</th><th>' + head[1] + '</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function section(i, title, body) {
    return '<section class="card" id="' + IDS[i] + '"><h2><span class="num">' + (i + 1) + '</span>' + title + '</h2>' + body + '</section>';
  }
  function datesHtml(t) {
    var items = visitItems(t.locale);
    if (!items.length) return '<p class="muted">' + t.counsel.visit.none + '</p>';
    return '<p class="muted" style="margin:6px 0 4px">' + t.counsel.visit.dates + '</p><ul class="dates">' +
      items.map(function (d) { return '<li' + (d.ko ? ' lang="ko"' : '') + '>' + esc(d.text) + '</li>'; }).join('') + '</ul>';
  }
  function render(lang) {
    var t = T[lang];
    current = lang;
    document.documentElement.lang = t.htmlLang;
    document.title = t.title;
    document.getElementById('eyebrow').textContent = t.eyebrow;
    document.getElementById('h1').textContent = t.h1;
    document.getElementById('lede').textContent = t.lede;
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    document.getElementById('toc-links').innerHTML = t.toc.map(function (label, i) { return '<a href="#' + IDS[i] + '">' + label + '</a>'; }).join('');

    var c = t.counsel;
    var ways =
      '<div class="ways">' +
        '<div class="way"><span class="tag">' + c.online.tag + '</span><h3>' + c.online.h + '</h3><p>' + c.online.p + '</p>' +
          '<div class="examples">' + c.examples.map(function (e) { return '<span>' + e + '</span>'; }).join('') + '</div>' +
          '<div class="actions"><a class="btn primary" href="chatbot.html">' + ICON.chat + c.online.chat + '</a><a class="btn" href="qna.html">' + c.online.qna + '</a></div></div>' +
        '<div class="way"><span class="tag">' + c.phone.tag + '</span><h3>' + c.phone.h + '</h3><p>' + c.phone.p + '</p>' +
          '<div class="actions"><a class="btn" href="apply.html">' + ICON.form + c.form + '</a></div></div>' +
        '<div class="way" id="visit-way"><span class="tag">' + c.visit.tag + '</span><h3>' + c.visit.h + '</h3><p>' + c.visit.p + '</p>' +
          '<div id="visit-dates">' + datesHtml(t) + '</div>' +
          '<div class="actions"><a class="btn" href="apply.html">' + ICON.form + c.form + '</a></div></div>' +
      '</div>';

    document.getElementById('main').innerHTML =
      '<div class="callout">' + ICON.info + '<div>' + t.callout + '</div></div>' +
      section(0, t.about.title, list(t.about.items)) +
      section(1, t.placement.title, list(t.placement.items)) +
      section(2, t.credit.title, list(t.credit.items)) +
      section(3, t.life.title, table(t.life.head, t.life.rows)) +
      section(4, c.title, '<p>' + c.intro + '</p>' + ways) +
      section(5, t.form.title, '<p>' + t.form.intro + '</p>' + table(t.form.head, t.form.rows) + '<p class="muted" style="margin-top:10px">' + t.form.cancel + '</p>') +
      section(6, t.help.title, list(t.help.items));
    document.getElementById('footer').innerHTML = t.footer.map(function (f) { return '<p>' + f + '</p>'; }).join('');
  }

  // ---- 언어 고르기: ?lang= → 지난번 선택 → 브라우저 언어 → 영어 -------------------------
  var KEY = 'cjhs_intl_lang';
  function norm(l) { l = String(l || '').toLowerCase(); return l.indexOf('ja') === 0 ? 'ja' : l.indexOf('zh') === 0 ? 'zh' : l.indexOf('en') === 0 ? 'en' : null; }
  function pickLang() {
    var q = norm(new URLSearchParams(location.search).get('lang'));
    if (q) return q;
    try { var s = norm(localStorage.getItem(KEY)); if (s) return s; } catch (e) {}
    var langs = navigator.languages || [navigator.language];
    for (var i = 0; i < langs.length; i++) { var n = norm(langs[i]); if (n) return n; }
    return 'en';
  }
  function setLang(lang) {
    render(lang);
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    var u = new URL(location.href); u.searchParams.set('lang', lang);
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  }
  document.querySelectorAll('.langs button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
  setLang(pickLang());
  if (location.hash) { var el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }

  // 관리자가 바꾼 방문 날짜(공개 읽기 문서)를 읽어 온다. 실패하면 기본값 그대로.
  fetch('https://firestore.googleapis.com/v1/projects/hello-cjhs/databases/(default)/documents/site_content/applyOptions')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (doc) {
      var field = doc && doc.fields && doc.fields.visitDates;
      if (!field || !field.arrayValue) return;
      var vals = field.arrayValue.values || []; // 빈 배열이면 values가 없다(= 예정된 설명회 없음)
      visitDates = vals.map(function (v) { return v.stringValue; }).filter(Boolean);
      var box = document.getElementById('visit-dates');
      if (box) box.innerHTML = datesHtml(T[current]);
    })
    .catch(function () {});
})();
</script>
<script src="js/update-check.js" defer></script>
</body>
</html>
