<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F2F6FB;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:#14284F;color:#fff}

  .hint{margin:4px 16px 0;font-size:13px;color:#5b6678;text-align:center}

<script type="module">import{enableImageZoom}from"./js/image-zoom.js";enableImageZoom(document,"main img");</script>
